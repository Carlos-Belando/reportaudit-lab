name: Release con SBOM y Procedencia Firmada

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-sbom:
    name: Generar SBOM, Atestar Procedencia y Publicar Release
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del tag
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar SBOM en formato CycloneDX JSON
        run: |
          python -m pip install cyclonedx-bom
          cyclonedx-py requirements requirements.txt --output-format JSON -o sbom-cyclonedx.json

      - name: Generar atestación firmada de procedencia (SLSA / GitHub Attestations)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "sbom-cyclonedx.json"

      - name: Crear GitHub Release y adjuntar SBOM
        uses: softprops/action-gh-release@v3
        with:
          files: sbom-cyclonedx.json
          generate_release_notes: true
